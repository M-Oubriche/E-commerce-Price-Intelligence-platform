version: 2

sources:
  - name: ecommerce
    description: "Raw landing data from all e-commerce scrapers and APIs"
    database: "{{ env_var('BIGQUERY_PROJECT_ID') }}"
    schema: "{{ env_var('BIGQUERY_DATASET') }}"
    tables:
      - name: raw_pricing_data
        description: "Unified raw events landing table for all product scrapes"
        columns:
          - name: raw_id
            tests:
              - unique
              - not_null
          - name: source
          - name: scraped_at
          - name: product
          - name: pricing
          - name: availability
          - name: seller
          - name: ratings
          - name: specs
