x-airflow-env:
  # --- Database ---
  # Points to our postgres service by its service name "postgres"
  # Inside Docker's network, services talk to each other by service name
  # NOT by localhost — localhost inside a container means the container itself
  &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  # --- Executor ---
  # LocalExecutor: runs tasks as subprocesses on the same machine
  # Requires PostgreSQL (not SQLite) — parallel subprocesses write to DB simultaneously
  # SQLite cannot handle concurrent writes — it will corrupt under LocalExecutor
  AIRFLOW__CORE__EXECUTOR: LocalExecutor

  # --- Security ---
  # Fernet key: encrypts passwords stored in Airflow's metadata DB
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

  # Secret key: secures Airflow webserver session cookies
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

  # --- Behavior ---
  # Never load example DAGs
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  # UTC is the industry standard for data pipelines
  # Never use local timezones in scheduling — it breaks with DST changes
  AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"

  # Parallelism appropriate for a development laptop
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"

  # Disable the "stable API" warning in logs (cosmetic)
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"

  # --- Bigtable Connectivity (real GCP) ---
  # BIGTABLE_EMULATOR_HOST is intentionally NOT set here — its absence tells the
  # Bigtable client to connect to real Google Cloud Bigtable using
  # GOOGLE_APPLICATION_CREDENTIALS (mounted as /secrets/bigquery-service-account.json).
  BIGTABLE_PROJECT_ID: ${BIGTABLE_PROJECT_ID}
  BIGTABLE_INSTANCE_ID: ${BIGTABLE_INSTANCE_ID}

  # --- Docker Connectivity ---
  # Forces the Docker CLI inside Airflow to use the correct socket path.
  # On Linux: /var/run/docker.sock (default)
  # On Windows Docker Desktop: uses the same Unix socket via Docker Desktop's compatibility layer
  DOCKER_HOST: "unix:///var/run/docker.sock"
  # Force API version 1.44 — Docker CLI 24.0.9 defaults to 1.43
  # but Windows Docker Desktop requires minimum 1.44
  DOCKER_API_VERSION: "1.44"
x-bigquery-env: &bigquery-env
  BIGQUERY_PROJECT_ID: ${BIGQUERY_PROJECT_ID}
  BIGQUERY_DATASET: ${BIGQUERY_DATASET}
  GOOGLE_APPLICATION_CREDENTIALS: /secrets/bigquery-service-account.json

# SERVICES

services:

  # SCRAPER
  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfiles/scraper.Dockerfile
    container_name: price_scraper
    stdin_open: true
    tty: true
    volumes:
      - ./scrapers:/app/scrapers
      # bind mount — host path ./data/raw maps to /data/raw in container
      - ./data/raw:/data/raw
      - ./data/archive:/data/archive
    env_file:
      - .env
    working_dir: /app/scrapers
    networks:
      - platform_net
    command: bash

  # POSTGRESQL — Airflow Metadata Database
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume — persists the database across docker compose down/up
      - postgres_data:/var/lib/postgresql/data
    ports:
      # this line should be removed in production — databases should never be publicly exposed
      - "5432:5432"
    networks:
      - platform_net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # AIRFLOW INIT — Database migration + admin user creation
  # This container runs once and exits with code 0.
  # The webserver and scheduler only start after it exits cleanly.
  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfiles/airflow.Dockerfile
    container_name: airflow_init
    depends_on:
      postgres:
        # Wait for postgres healthcheck to pass before starting
        condition: service_healthy
    environment:
      <<: [*airflow-env, *bigquery-env]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      # Same bind mount as the scraper — Airflow can read what the scraper writes
      - ./data/raw:/data/raw
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro
    networks:
      - platform_net
    # Two commands run sequentially:
    # db migrate — creates/updates all Airflow tables in PostgreSQL
    # users create — creates the admin UI user
    # "|| true" prevents failure if the user already exists on re-run (info are updated in the airflow dashboard)
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@platform.local || true
      "

  # AIRFLOW WEBSERVER — The UI at http://localhost:8081
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfiles/airflow.Dockerfile
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        # Only start after init has completed successfully (exit code 0)
        # If init fails, webserver never starts
        condition: service_completed_successfully
    environment:
      <<: [*airflow-env, *bigquery-env]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - ./data/raw:/data/raw
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro
    ports:
      - "8081:8080"
    networks:
      - platform_net
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # AIRFLOW SCHEDULER — Reads DAGs and triggers task execution
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfiles/airflow.Dockerfile
    container_name: airflow_scheduler
    user: root
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: [*airflow-env, *bigquery-env]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      # Scheduler needs this because tasks (not just DAGs) run here
      # under LocalExecutor — tasks read from /data/raw directly
      - ./data/raw:/data/raw
      # Archive dir — Airflow archives processed JSONL files here
      - ./data/archive:/data/archive
      # Allow Airflow to trigger docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro
    networks:
      - platform_net
    command: scheduler

  # APACHE NIFI — Real-time streaming ingestion
  # we are using single-node, not Clustering to avoid complexity
  # Single-node handles our data volumes comfortably
  # Ports
  # 8080: taken by Airflow webserver
  # 8090: NiFi UI (http://localhost:8090/nifi)
  # 9090: ListenHTTP processor entry point: 
  #       Scraper POSTs JSON here: http://nifi:9090 (inside Docker)
  nifi:
    build:
      context: .
      dockerfile: docker/Dockerfiles/nifi.Dockerfile
    container_name: price_nifi
    restart: unless-stopped
    depends_on:
      app_postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # HTTP mode (HTTPS disabled for local dev)
      NIFI_WEB_HTTP_PORT: "8090"
      NIFI_WEB_HTTPS_PORT: "" # HTTPS disabled
      NIFI_WEB_HTTP_HOST: "0.0.0.0" # Listen on all interfaces in container

      # Single user login
      # These become your NiFi UI username and password
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}

      # JVM Memory
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"

      # Cluster mode (off - no need)
      NIFI_CLUSTER_IS_NODE: "false"
      NIFI_ELECTION_MAX_WAIT: "1 min"

      # Bigtable connection (real GCP — no emulator host)
      BIGTABLE_PROJECT_ID: ${BIGTABLE_PROJECT_ID}
      BIGTABLE_INSTANCE_ID: ${BIGTABLE_INSTANCE_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/bigquery-service-account.json

      # App Postgres — used by nifi_ingest.py to write price-drop alerts
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      APP_POSTGRES_DB: ${APP_POSTGRES_DB}

    volumes:
      # nifi_conf: the entire flow lives here
      # nifi_database: NiFi's internal component registry and state
      # nifi_provenance: data lineage records
      # Essential for debugging when data doesn't arrive in Bigtable
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./scrapers:/app/scrapers
      - ./data/raw:/data/raw
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro

    ports:
      - "8090:8090" # NiFi UI: http://localhost:8090/nifi
      - "9090:9090" # ListenHTTP: scraper POSTs JSON here

    networks:
      - platform_net

    healthcheck:
      # NiFi takes 60-90 seconds to fully boot
      # /nifi-api/system-diagnostics returns 200 only when fully ready
      test: [ "CMD", "curl", "--fail", "http://localhost:8090/nifi-api/system-diagnostics" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # APPLICATION SERVICES (Frontend, Backend, DB, Cache)

  # APPLICATION POSTGRESQL — Project Database
  app_postgres:
    image: postgres:15
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Exposed on 5433 to avoid conflict with Airflow DB
    networks:
      - platform_net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_POSTGRES_USER}", "-d", "${APP_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # REDIS
  redis:
    image: redis:7-alpine
    container_name: price_redis
    restart: unless-stopped
    command: redis-server
    ports:
      - "6379:6379"
    networks:
      - platform_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # BACKEND
  backend:
    build:
      context: ./app/backend
      dockerfile: ../../docker/Dockerfiles/backend.Dockerfile
    container_name: price_backend
    restart: unless-stopped
    depends_on:
      app_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app_postgres:5432/${APP_POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/bigquery-service-account.json
      - BIGQUERY_PROJECT_ID=${BIGQUERY_PROJECT_ID}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET}
    volumes:
      # Mount the code for live development
      - ./app/backend:/app
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro
    ports:
      - "8000:8000"
    networks: 
      - platform_net
    # Run Uvicorn with hot-reload enabled. 
    # NOTE: if main.py is in another place, change "main:app" to "<path>.main:app"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # BACKGROUND WORKER
  price_worker:
    build:
      context: ./app/backend
      dockerfile: ../../docker/Dockerfiles/backend.Dockerfile
    container_name: price_worker
    restart: unless-stopped
    depends_on:
      app_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app_postgres:5432/${APP_POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app/backend:/app
    networks:
      - platform_net
    command: python worker/main.py

  # FRONTEND
  frontend:
    build:
      context: ./app/frontend
      dockerfile: ../../docker/Dockerfiles/frontend.Dockerfile
      target: development
    container_name: price_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # Mount the code for live development
      - ./app/frontend:/app
      # Anonymous volume for node_modules so host doesn't overwrite it
      - /app/node_modules
    ports:
      - "4200:4200"
    networks:
      - platform_net
    # The developer can just drop their existing Angular files into app/frontend.
    # Once package.json is detected, it will automatically install dependencies and start the dev server.
    command: sh -c "if [ -f package.json ]; then npm install && npx ng serve --host 0.0.0.0 --poll 2000; else echo 'Waiting for Angular files to be pasted...' && tail -f /dev/null; fi"

  # DBT — Data transformation
  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfiles/dbt.Dockerfile
    container_name: price_dbt
    restart: unless-stopped
    environment:
      <<: *bigquery-env
    volumes:
      - ./dbt:/dbt
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro
    working_dir: /dbt
    networks:
      - platform_net
    entrypoint: ["tail", "-f", "/dev/null"]

  # DBT DOCS — Lineage documentation server
  # HOW to use:
  # 1 - First generate docs: docker compose exec dbt dbt docs generate
  # 2 - docs server auto-serves at http://localhost:8085
  dbt-docs:
    build:
      context: .
      dockerfile: docker/Dockerfiles/dbt.Dockerfile
    container_name: price_dbt_docs
    restart: unless-stopped
    environment:
      <<: *bigquery-env
    volumes:
      - ./dbt:/dbt
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
      - ./infrastructure/keys/bigquery-service-account.json:/secrets/bigquery-service-account.json:ro
    working_dir: /dbt
    ports:
      - "8085:8085"
    networks:
      - platform_net
    # dbt 1.8 removed the --host flag, so we override the entrypoint and use Python's built-in server
    entrypoint: ["bash", "-c"]
    command: >
      "
      echo 'Waiting for target/index.html (run: docker-compose exec dbt dbt docs generate)';
      while [ ! -f target/index.html ]; do sleep 5; done;
      echo 'Docs generated! Starting server on http://localhost:8085';
      python -m http.server 8085 --bind 0.0.0.0 --directory target
      "

# NETWORKS
#
# All services share one bridge network called platform_net.
# Services reference each other by service name — not by IP or localhost.
# Example: Airflow connects to PostgreSQL at host "postgres", port 5432.
# this is our project's shared network — not an auto-generated one.
networks:
  platform_net:
    driver: bridge

# VOLUMES
# Only NAMED volumes go here. Bind mounts (./data/raw:/data/raw)
# are defined inline in each service and do not appear here.
# postgres_data — persists Airflow's metadata DB (DAG runs, users, logs)
# airflow_logs  — persists task logs so you can read them after restarts
volumes:
  postgres_data:
  airflow_logs:

  # Application DB
  app_postgres_data:

  # NiFi
  nifi_conf:
  nifi_database:
  nifi_provenance:
