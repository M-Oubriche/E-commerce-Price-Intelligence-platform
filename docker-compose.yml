# docker-compose.yml
# Phase 1: Scraper + PostgreSQL + Airflow + NiFi + Bigtable Emulator
#
# Services added later (separate phases):
#   - dbt

x-airflow-env:
  # --- Database ---
  # Points to our postgres service by its service name "postgres"
  # Inside Docker's network, services talk to each other by service name
  # NOT by localhost — localhost inside a container means the container itself
  &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  # --- Executor ---
  # LocalExecutor: runs tasks as subprocesses on the same machine
  # Requires PostgreSQL (not SQLite) — parallel subprocesses write to DB simultaneously
  # SQLite cannot handle concurrent writes — it will corrupt under LocalExecutor
  AIRFLOW__CORE__EXECUTOR: LocalExecutor

  # --- Security ---
  # Fernet key: encrypts passwords stored in Airflow's metadata DB
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

  # Secret key: secures Airflow webserver session cookies
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

  # --- Behavior ---
  # Never load example DAGs
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  # UTC is the industry standard for data pipelines
  # Never use local timezones in scheduling — it breaks with DST changes
  AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"

  # Parallelism appropriate for a development laptop
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"

  # Disable the "stable API" warning in logs (cosmetic)
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"

# SERVICES

services:

  # SCRAPER
  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfiles/scraper.Dockerfile
    container_name: price_scraper
    stdin_open: true
    tty: true
    volumes:
      - ./scrapers:/app/scrapers
      # bind mount — host path ./data/raw maps to /data/raw in container
      - ./data/raw:/data/raw
    env_file:
      - .env
    working_dir: /app/scrapers
    networks:
      - platform_net
    command: bash

  # POSTGRESQL — Airflow Metadata Database
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume — persists the database across docker compose down/up
      - postgres_data:/var/lib/postgresql/data
    ports:
      # this line should be removed in production — databases should never be publicly exposed
      - "5432:5432"
    networks:
      - platform_net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # AIRFLOW INIT — Database migration + admin user creation
  # This container runs once and exits with code 0.
  # The webserver and scheduler only start after it exits cleanly.
  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfiles/airflow.Dockerfile
    container_name: airflow_init
    depends_on:
      postgres:
        # Wait for postgres healthcheck to pass before starting
        condition: service_healthy
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      # Same bind mount as the scraper — Airflow can read what the scraper writes
      - ./data/raw:/data/raw
    networks:
      - platform_net
    # Two commands run sequentially:
    # db migrate — creates/updates all Airflow tables in PostgreSQL
    # users create — creates the admin UI user
    # "|| true" prevents failure if the user already exists on re-run (info are updated in the airflow dashboard)
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@platform.local || true
      "

  # AIRFLOW WEBSERVER — The UI at http://localhost:8081
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfiles/airflow.Dockerfile
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        # Only start after init has completed successfully (exit code 0)
        # If init fails, webserver never starts
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      - ./data/raw:/data/raw
    ports:
      - "8081:8080"
    networks:
      - platform_net
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # AIRFLOW SCHEDULER — Reads DAGs and triggers task execution
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfiles/airflow.Dockerfile
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
      # Scheduler needs this because tasks (not just DAGs) run here
      # under LocalExecutor — tasks read from /data/raw directly
      - ./data/raw:/data/raw
    networks:
      - platform_net
    command: scheduler

  # APACHE NIFI — Real-time streaming ingestion
  # we are using single-node, not Clustering to avoid complexity
  # Single-node handles our data volumes comfortably
  # Ports
  # 8080: taken by Airflow webserver
  # 8090: NiFi UI (http://localhost:8090/nifi)
  # 9090: ListenHTTP processor entry point: 
  #       Scraper POSTs JSON here: http://nifi:9090 (inside Docker)
  nifi:
    build:
      context: .
      dockerfile: docker/Dockerfiles/nifi.Dockerfile
    container_name: price_nifi
    restart: unless-stopped
    depends_on:
      bigtable-emulator:
        condition: service_healthy
    environment:
      # HTTP mode (HTTPS disabled for local dev)
      NIFI_WEB_HTTP_PORT: "8090"
      NIFI_WEB_HTTPS_PORT: "" # HTTPS disabled
      NIFI_WEB_HTTP_HOST: "0.0.0.0" # Listen on all interfaces in container

      # Single user login
      # These become your NiFi UI username and password
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}

      # JVM Memory
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"

      # Cluster mode (off - no need)
      NIFI_CLUSTER_IS_NODE: "false"
      NIFI_ELECTION_MAX_WAIT: "1 min"

      # Bigtable connection
      BIGTABLE_PROJECT_ID: ${BIGTABLE_PROJECT_ID}
      BIGTABLE_INSTANCE_ID: ${BIGTABLE_INSTANCE_ID}
      BIGTABLE_EMULATOR_HOST: "bigtable-emulator:8086"

    volumes:
      # nifi_conf: the entire flow lives here
      # nifi_database: NiFi's internal component registry and state
      # nifi_provenance: data lineage records
      # Essential for debugging when data doesn't arrive in Bigtable
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository

      # NiFi flow templates
      - ./nifi/templates:/opt/nifi/nifi-current/conf/templates

    ports:
      - "8090:8090" # NiFi UI: http://localhost:8090/nifi
      - "9090:9090" # ListenHTTP: scraper POSTs JSON here

    networks:
      - platform_net

    healthcheck:
      # NiFi takes 60-90 seconds to fully boot
      # /nifi-api/system-diagnostics returns 200 only when fully ready
      test: [ "CMD", "curl", "--fail", "http://localhost:8090/nifi-api/system-diagnostics" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # GOOGLE CLOUD BIGTABLE EMULATOR
  bigtable-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    container_name: bigtable_emulator
    restart: unless-stopped
    command: >
      gcloud beta emulators bigtable start --host-port=0.0.0.0:8086 --project=${BIGTABLE_PROJECT_ID}
    ports:
      - "8086:8086"
    networks:
      - platform_net
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8086'" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# NETWORKS
#
# All services share one bridge network called platform_net.
# Services reference each other by service name — not by IP or localhost.
# Example: Airflow connects to PostgreSQL at host "postgres", port 5432.
# this is our project's shared network — not an auto-generated one.
networks:
  platform_net:
    driver: bridge

# VOLUMES
# Only NAMED volumes go here. Bind mounts (./data/raw:/data/raw)
# are defined inline in each service and do not appear here.
# postgres_data — persists Airflow's metadata DB (DAG runs, users, logs)
# airflow_logs  — persists task logs so you can read them after restarts
volumes:
  postgres_data:
  airflow_logs:

  # NiFi
  nifi_conf:
  nifi_database:
  nifi_provenance:
